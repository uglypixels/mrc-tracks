name: sync
on:
  schedule:
    - cron: '17,47 * * * *' # off :00/:30, GitHub delays or drops runs at peak times
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node sync.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ vars.GUILD_ID }}
          FORUM_CHANNEL_ID: ${{ vars.FORUM_CHANNEL_ID }}
          APPROVED_TAG: ${{ vars.APPROVED_TAG }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "sync" && git push
      # Pushes made with GITHUB_TOKEN don't trigger Pages builds, so deploy from here.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Separate job: deploy-pages failed to find an artifact uploaded in its own job.
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
